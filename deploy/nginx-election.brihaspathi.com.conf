# Nginx config for election.brihaspathi.com
# Proxies to Next.js on port 4001. Use with Certbot for HTTPS.
#
# Install: sudo cp deploy/nginx-election.brihaspathi.com.conf /etc/nginx/sites-available/
# Enable:  sudo ln -s /etc/nginx/sites-available/nginx-election.brihaspathi.com.conf /etc/nginx/sites-enabled/
# Test:    sudo nginx -t && sudo systemctl reload nginx
#
# Then run Certbot: sudo certbot --nginx -d election.brihaspathi.com

server {
    listen 80;
    listen [::]:80;
    server_name election.brihaspathi.com;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy backend (Strapi) so HTTPS page can call API without mixed-content block
    # Extended timeouts for survey photo uploads and slow Strapi responses (default 60s can cut off large uploads)
    location /backend-api/ {
        proxy_pass http://183.82.117.36:1337/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Proxy speedtest backend (survey creation page) so HTTPS page can run speed test
    location /speedtest-backend/ {
        proxy_pass http://156.67.110.186:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
